[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gameplay-events"
version = "0.1.0"
description = "An auditable video-to-event pipeline for SuperTux gameplay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.10", "scipy>=1.12", "imageio-ffmpeg>=0.5", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gameplay-events = "gameplay_events.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
